<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>skywright demo</title>
    <!-- Before first paint: the saved theme ("light" or "dark", shared with the host site; absent means System). -->
    <script>
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
      } catch (error) {
        // Storage blocked: follow the system.
      }
    </script>
    <!-- Page backgrounds until the app paints; they equal example/src/palettes.ts (test/example-index-html.test.ts). -->
    <style id="theme-page">
      html,
      body {
        background-color: #e3ebf3;
        color-scheme: light;
      }
      :root[data-theme='dark'],
      :root[data-theme='dark'] body {
        background-color: #1a1816;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]),
        :root:not([data-theme]) body {
          background-color: #1a1816;
          color-scheme: dark;
        }
      }
      /* The host site draws its backdrop behind the app. */
      :root[data-host-backdrop],
      :root[data-host-backdrop] body {
        background-color: transparent;
      }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <link rel="icon" href="/skywright/favicon.ico"/></head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  <script src="/skywright/_expo/static/js/web/index-5acd744cba82a5b3420ac6cb625e710b.js" defer></script>
</body>
</html>
