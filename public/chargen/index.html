<body>
<div class="wrap">
  <div class="top">
    <h1>Dungeon character generator <span class="by">for <i>World of Dungeons</i> by John Harper</span></h1>
    <div class="controls">
      <label class="ctl">Class <select id="cls"></select></label>
      <label class="ctl"><input type="checkbox" id="weird"> Dream-desert quirk</label>
      <fieldset class="method" id="method"><legend>Attributes</legend>
        <span class="seg">
          <label><input type="radio" name="attrs" id="attrsRoll" value="roll" checked> Roll 2d6</label>
          <label><input type="radio" name="attrs" id="attrsArray" value="array"> Standard array, random</label>
          <label><input type="radio" name="attrs" id="attrsPick" value="pick"> Standard array, choose</label>
        </span>
      </fieldset>
      <button id="go">Roll a character</button>
      <button id="copy" class="ghost">Copy as text</button>
      <button id="printBlank" class="ghost">Print blank sheet</button>
      <fieldset class="method" id="theme"><legend>Theme</legend>
        <span class="seg">
          <label><input type="radio" name="theme" id="themeLight" value="light"> Light</label>
          <label><input type="radio" name="theme" id="themeDark" value="dark"> Dark</label>
          <label><input type="radio" name="theme" id="themeSystem" value="system" checked> System</label>
        </span>
      </fieldset>
    </div>
  </div>
  <p class="confirm" id="confirm" role="alert" hidden>Rolling replaces this character and your edits.
    <button id="confirmYes">Discard edits and roll</button> <button id="confirmNo" class="ghost">Keep editing</button></p>
  <p class="seedline">Seed <code id="seed"></code> <button id="link" class="ghost">Copy link</button>
    <button id="resetAll" class="ghost" hidden>Reset all edits</button></p>
  <div class="toast" id="toast" aria-live="polite"></div>
  <div class="artbar">
    <fieldset class="method" id="art"><legend>Sheet</legend>
      <span class="seg">
        <label><input type="radio" name="art" id="artColor" value="color" checked> Color</label>
        <label><input type="radio" name="art" id="artBw" value="bw"> Printer friendly</label>
      </span>
    </fieldset>
    <label class="ctl"><input type="checkbox" id="printColor"> Print in full color</label>
  </div>
  <div class="page" id="page" data-art="color" data-print="bw">
    <div class="sheetbox">

e Second-Best","Ashcloak","the Barefoot","Hook-Nose","of the Sunken Road","the Allegedly Lucky","Ironbelly","the Twice-Robbed","of the Broken Oath","Mirror-Shy","the Far-Travelled","Bramble","the Unforgiven","One-Boot","of the Hundred Steps","the Owed","Lockjaw","the Gloomy","Splinter","of the Red Hour","the Stray","Dust-Drinker","the Wrongly Accused","Cat-Eyes","of the Tilted Tower","the Humble","Grave-Digger","the Heir Presumptive","Scabknee","of the Glass Shore","the Unremarkable","Weasel","the Oft-Mistaken","Smoke-Breath","of the Hungry Hills","the Slow","Copperteeth","the Kinless","Stormcrow","of the Locked Room","the Truthful","Sixpence","the Ever-Hopeful","Bogwater","of the Wrong Side","the Woken","Knucklebones","the Pale","Featherweight","of the Ashen Mile","the Borrower","Long-Shanks","the Mildly Cursed","Gutterborn","of the Moon's Leavings","the Eel","Pot-Mender","the Unbidden"]},spirits:{domains:["flame","shadow","stone","lightning","secrets","fear","frost","smoke","tides","rot","glass","wind","dreams","bones","mirrors","salt","hunger","echoes"],looks:["a moth the size of a hand, with a human mouth","a child-shaped absence in the air","a coil of blue smoke that smells of cloves","a jackal made of wet ink","a voice that comes from under the floor","a tall heron with too many knees","a lantern flame that blinks when it lies","a weeping marble face","a swarm of copper flies","an old woman stitched from moonlight"],nameStart:["Ix","Vor","Ul","Shae","Gol","Nym","Aza","Thul","Pek","Oru"],nameEnd:["imar","oth","ek","isse","umbra","ax","eleth","orrow","yn","aghast"]},quirks:["Your shadow runs about half a second behind you.","You arrived here asleep and are not fully sure you've woken.","Coins taste of smoke to you, and you like it.","Your reflection wears a different hat.","You hum in a key no one else can hear, and some things hum back.","Sand never sticks to you. People notice.","You remember a door you walked through. You can't find it again.","Your teeth are counted, nightly, by something polite.","You can read any sign, but only once.","The color of your eyes changes with the weather.","You owe a favor to a skull. It keeps reminding you.","You sleep standing up, like a horse, and dream in pastel.","Your footprints fill with water a moment after you step away.","You can hear the sand falling in every hourglass in the room.","Birds will not land anywhere you are looking.","You cast two shadows at noon and none at dusk.","Your voice sounds faintly like someone else's when you lie.","Nothing has ever bitten you, and the insects seem to apologize.","Doors you close are slightly warm afterwards.","You dream of the same red tent every night, and it is getting closer.","Dust settles on you in the shape of letters.","Your hair grows only when the moon is new.","Mirrors show you a moment late, waving.","You can tell the time by the taste of the air.","A single polite goat follows you at a distance.","Candles lean toward you when you speak.","You wake each morning with one more grain of sand in your fist.","Your heartbeat can be heard across a quiet room.","Strangers sometimes greet you by a name you have never used.","You never feel the heat, only the color of it.","Coins you spend come back to your pocket a few days later, slightly bent.","Your blood is the color of weak tea.","You remember tomorrow's weather but nothing about yesterday's.","Wells echo your name before you speak.","Your scars rearrange themselves while you sleep.","You can walk on hot coals, but cold floors make you weep.","Small lizards bring you gifts.","When you laugh, distant bells answer.","You carry a key that fits no door yet.","Your breath frosts glass even in summer.","You cannot cross running water without singing.","Anyone who sleeps beside you dreams of the desert at night.","Your shadow is a little taller than you, and prouder.","You can smell a lie, and it smells of oranges.","The stars you point at go briefly dim.","Your tattoos drift slowly around your body over the year.","You were born with a coin under your tongue and keep it there still.","Mice sit very still when you pass.","A second set of footprints walks beside yours on sand.","Your fingertips taste of salt to anyone who kisses them.","You talk in your sleep in a language no scholar recognizes.","Ink will not stay on your skin, or on anything you write.","A small cloud follows you indoors.","Your eyes reflect a different sky than the one overhead.","Rope knots itself when you are nervous.","Every seventh day the wind says your true name.","You never sweat, but sand pours from your sleeves when you are afraid.","Wine turns to water in your cup, and water to sand.","Anything you bury, you dream of until it is dug up.","Your reflection in still water is always asleep.","You can see the outlines of doors in blank walls.","Your laugh sours milk.","You are always exactly as warm as the person nearest you.","Moths gather in your hat and leave messages in the dust.","Your footsteps sound like someone walking two rooms away.","You have no smell, and dogs find this deeply upsetting.","You sneeze whenever someone nearby is thinking of you.","The dead are always civil to you.","You count everything twice and get a different number each time.","Your shadow sometimes points the way to water.","A mouth-shaped birthmark on your back whispers in thunderstorms.","Your words leave a taste of copper in other people's mouths.","You dream other people's memories, mostly boring ones.","Lamps burn blue in your presence.","Your hands are always cold, even in fire.","Every map you touch gains a road that wasn't there.","You can hold your breath exactly as long as the person you love.","You can't remember your mother's face, but every statue has it.","While you sleep, your body drifts a hand's width toward the east.","Thrown dice land on four while you are watching.","You always smell of rain, even in the deepest dungeon.","Spiders weave little doors in the corners of your room.","Your teeth chime softly near gold.","Nobody can remember a song past the second verse after you have sung it.","Your echo argues back.","Your hair stands up when something dead is near.","Snakes ignore you, pointedly.","Wherever you are, even indoors, you can see a dune on the horizon.","Your name is written in the sand wherever you wake.","You never get lost, but you are often somewhere you didn't mean to go.","Food goes stale in your pack overnight; sand never does.","You collect teeth, and some of them are still deciding.","Fires hiss your name when you sit too close.","You can feel how many people are in a building by touching its wall.","Cats follow you, always at a slight angle.","Your blood smells of cinnamon.","Other people sometimes remember your dreams.","A blind old dog waits in every town you visit, and it knows you.","You always know which way is down, even where there is no down.","Some mornings you wake with the dust of a road you have never walked on your feet.","Your shadow still wears the hat you lost three years ago.","Flowers turn to face you, then quickly away.","You have exactly one grey hair, and it moves.","Bread rises when you hum.","Gamblers who touch you for luck lose, and thank you anyway.","The sun rises a little later wherever you sleep.","You can taste colors, and red is your least favorite.","You talk to your knife, and it has opinions.","Wells and pits feel like open mouths to you, waiting politely.","Your sweat dries into tiny crystals of sugar.","Every so often you hear the sea, and there is never a sea.","Your footprints in sand point backward.","You were once a statue, briefly. You don't talk about it.","Ravens bow to you.","You can only fall asleep under the open sky or a stranger's roof.","A lantern you carry never runs out until you put it down.","You have a heartbeat in your left hand and another, slower, in your right.","Your shadow glows faintly in total darkness.","Everything you write turns into poetry overnight." (function(root,factory){if(typeof module==="object"&&module.exports)module.exports=factory();else root.ChargenRules=factory()})(typeof self!=="undefined"?self:this,function(){const EFFECT_KEYS=["damage","armor","armorLighter","hp","spirits","needs","note"];const DAMAGE_KEYS=["all","melee","ranged"];function makeDice(random){const d6=()=>1+Math.floor(random()*6);const pick=list=>{if(!list.length)throw new Error("cannot pick from an empty list");return list[Math.floor(random()*list.length)]};const shuffle=list=>{const out=list.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out};const weighted=entries=>{let roll2=random()*entries.reduce((total,entry)=>total+entry.weight,0);const chosen=entries.find(entry=>(roll2-=entry.weight)<0);if(!chosen)throw new Error("cannot pick from entries without positive weights");return chosen};return{d6,pick,shuffle,weighted}}function lookup(table,key,what){if(!Object.prototype.hasOwnProperty.call(table,key))throw new Error(`unknown ${what}: ${key}`);return table[key]}function attrVal(data,total){const row=data.attributeBonus.find(r=>total<=r.upTo);if(!row)throw new Error(`attribute total ${total} is beyond the bonus table`);return row.bonus}function dmgStr(base,bonus){const t=base+bonus;return t>0?"d6+"+t:"d6"}function sumEffect(held,read){return held.reduce((total,ability)=>total+(read(ability.effects)??0),0)}function makeName(dice,flavor){const region=dice.pick(Object.keys(flavor.trueNames));const{given,surnames}=lookup(flavor.names.regions,region,"name region");const first=dice.pick(flavor.trueNames[region].concat(given));const{parts}=dice.weighted(flavor.names.forms);const words=[first];if(parts.includes("surname"))words.push(dice.pick(surnames));if(parts.includes("moniker"))words.push(dice.pick(flavor.names.monikers));return{name:words.join(" "),region,given:first}}function makeTrueName(dice,trueNames,given){const drawn=dice.pick(trueNames);return drawn===given?trueNa has(data.weapons,w)).map(w=>`weapon ${w}`),...has(data.armor,kit.armor)?[]:[`armor ${kit.armor}`],...kit.items.filter(it=>!has(data.items,it)).map(it=>`item ${it}`)];if(missing.length){problems.push(`${kitWhere}: unknown ${missing.join(", ")}`);return}const cost=kitCost(data,kit);if(cost>data.startingSilver)problems.push(`${kitWhere} costs ${cost}, over ${data.startingSilver}`);if(spec.restrictions.includes("no-weapons")&&kit.weapons.length)problems.push(`${kitWhere}: carries weapons`);if(spec.restrictions.includes("no-armor")&&(data.armor[kit.armor].armor||kit.items.some(it=>data.items[it].armor)))problems.push(`${kitWhere}: wears armor`)})}const custom=data.customClass;if(has(data.classes,custom.id)||custom.id==="Random")problems.push(`customClass.id ${custom.id} clashes with a class choice`);if(custom.classSkills+custom.extraSkills>data.skills.length)problems.push("customClass: more skills than exist");if(custom.abilities>Object.keys(data.abilities).length)problems.push("customClass: more abilities than exist");return problems}function listProblems(where,list){if(!Array.isArray(list)||!list.length)return[`${where}: empty`];const problems=[];const seen=new Set;for(const entry of list){if(typeof entry!=="string"||!entry)problems.push(`${where}: an entry is not a non-empty string`);else if(entry.trim()!==entry)problems.push(`${where}: leading or trailing space in "${entry}"`);if(seen.has(entry))problems.push(`${where}: duplicate "${entry}"`);seen.add(entry)}return problems}function validateFlavor(flavor){const problems=[];const has=(table,key)=>Object.prototype.hasOwnProperty.call(table,key);const pdfNames=new Set(Object.values(flavor.trueNames).flat());for(const[region,trueNames]of Object.entries(flavor.trueNames)){problems.push(...listProblems(`trueNames.${region}`,trueNames));if(trueNames.length<2)problems.push(`trueNames.${region}: needs at least two true names`);if(!has(flavor.names.regions,region))problems.push(`names.regions has no ${region}`)}for(const[regio
