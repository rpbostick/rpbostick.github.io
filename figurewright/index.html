<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="figurewright: build an avatar that looks like you, with body shapes, swappable heads and layered garments that fit every body." />
    <title>figurewright</title>
    <script>
      // The saved theme choice, applied before first paint (see src/shared/theme.ts).
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/figurewright/main.tsx"></script>
  </body>
</html>
